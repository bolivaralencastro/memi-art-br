  <style>
    .confirm-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 1rem;
      padding: 2rem;
    }
    .confirm-icon { font-size: 5rem; }
    .confirm-page h1 { font-size: 2rem; font-weight: 900; }
    .confirm-page p { color: #888; max-width: 36ch; margin: 0 auto; }
    .back-btn {
      display: inline-block;

<body>

    <a href="/" class="logo">me<span>mi</span></a>

  <div class="confirm-page">
    <div class="confirm-icon">🎉</div>
    <h1>Pedido confirmado!</h1>
    <p>Obrigado pela compra. Você receberá um e-mail com os detalhes e o código de rastreio assim que seu pedido for enviado.</p>

  <script>
    window.dataLayer = window.dataLayer || [];
    const params = new URLSearchParams(window.location.search);
    if (params.get('collection_status') === 'approved') {
      dataLayer.push({
        event: 'purchase',
